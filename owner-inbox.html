<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lito Tech | Private Inbox</title><link rel="stylesheet" href="styles.css?v=20260905a"></head>
<body><main class="inbox-page"><section class="inbox-card"><p class="eyebrow">Lito Tech</p><h1>Private inbox</h1><form id="owner-login" class="inbox-login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="button button-primary">Sign in</button><p id="login-message"></p></form><div id="inbox" hidden><div class="inbox-toolbar"><strong id="owner-email"></strong><button id="sign-out" class="button button-secondary">Sign out</button></div><div class="inbox-layout"><aside id="conversations" class="inbox-list"></aside><section class="inbox-thread"><div id="thread-title">Select a conversation</div><div id="messages" class="inbox-messages"></div><form id="reply-form" hidden><textarea id="reply" rows="4" required placeholder="Write a reply"></textarea><button class="button button-primary">Send reply</button><p id="reply-status" class="custom-chat-feedback"></p></form></section></div></div></section></main><script src="owner-inbox.js?v=20260904e"></script></body></html>
